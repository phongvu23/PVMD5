
<script>
const result = document.getElementById("result");
const status = document.getElementById("autoStatus");

let lastHex = "";

function convert(hex) {
  hex = hex.trim();

  if (!/^[0-9a-fA-F]{32}$/.test(hex)) return;

  if (hex === lastHex) return;
  lastHex = hex;

  const parts = hex.match(/.{8}/g);

  const values = parts.map(part =>
    parseInt(part, 16) % 5
  );

  const symbols = values.map(value => {
    if (value === 1 || value === 3) return "⚪";
    if (value === 2 || value === 4) return "🔴";
    return "⚫";
  });

  const unique = new Set(values);

  result.innerHTML = `
    <div class="number">
      ${values.join(" - ")}
    </div>

    <div class="symbols">
      ${symbols.join(" ")}
    </div>

    <div class="status ${
      unique.size === 4 ? "success" : "error"
    }">
      ${
        unique.size === 4
        ? "✓ 4 kết quả khác nhau"
        : "⚠ Có kết quả trùng nhau"
      }
    </div>
  `;

  localStorage.setItem("hex_auto_value", hex);
}

// Đọc Clipboard
async function readClipboard() {
  try {
    const text = await navigator.clipboard.readText();

    const match = text.match(
      /[0-9a-fA-F]{32}/
    );

    if (match) {
      convert(match[0]);
      status.textContent = "✓ Đã tự động nhận mã HEX";
    }

  } catch (error) {
    status.textContent =
      "Chưa được cấp quyền đọc Clipboard";
  }
}

// Yêu cầu quyền đọc Clipboard
async function startAutoRead() {
  if (!navigator.clipboard ||
      !navigator.clipboard.readText) {
    status.textContent =
      "Trình duyệt không hỗ trợ Clipboard API";
    return;
  }

  await readClipboard();

  // Kiểm tra lại khi người dùng quay về tab
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) readClipboard();
  });

  // Kiểm tra định kỳ khi trang đang mở
  setInterval(() => {
    if (!document.hidden) readClipboard();
  }, 1500);
}

// Khởi động
startAutoRead();
</script>
