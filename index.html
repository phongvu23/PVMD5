
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HEX Converter</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  background: #101827;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 500px;
  margin: 50px auto;
  padding: 25px;
  background: #1e293b;
  border-radius: 15px;
  text-align: center;
}

input {
  width: 100%;
  padding: 15px;
  margin: 15px 0;
  background: #0f172a;
  border: 1px solid #475569;
  border-radius: 8px;
  color: white;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 14px;
  background: #3b82f6;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.result {
  margin-top: 25px;
  padding: 20px;
  background: #0f172a;
  border-radius: 10px;
}

.number {
  font-size: 32px;
  font-weight: bold;
  color: #4ade80;
  letter-spacing: 4px;
}

.status {
  margin-top: 15px;
  font-size: 14px;
}

.error { color: #f87171; }
.success { color: #4ade80; }
</style>
</head>

<body>

<div class="container">

<h2>HEX CONVERTER</h2>

<input
  id="hexInput"
  type="text"
  maxlength="32"
  placeholder="Nhập mã HEX 32 ký tự..."
>

<button onclick="convert()">Đoán mò</button>

<div class="result" id="result">
  <div class="number">- - - -</div>
</div>

</div>

<script>
function convert() {
  const input = document.getElementById("hexInput");
  const hex = input.value.trim();
  const result = document.getElementById("result");

  // Xóa mã ngay sau khi bấm chuyển đổi
  input.value = "";

  if (!/^[0-9a-fA-F]{32}$/.test(hex)) {
    result.innerHTML =
      '<div class="error">Mã HEX không hợp lệ! Cần đúng 32 ký tự.</div>';
    return;
  }

  const parts = hex.match(/.{8}/g);

  const values = parts.map(part =>
    parseInt(part, 16) % 5
  );

  const unique = new Set(values);

  let status = unique.size === 4
    ? '<div class="status success">✓ 4 kết quả khác nhau</div>'
    : '<div class="status error">⚠ Có kết quả trùng nhau</div>';

  result.innerHTML = `
    <div class="number">${values.join(" - ")}</div>
    ${status}
  `;
}
</script>

</body>
</html>
