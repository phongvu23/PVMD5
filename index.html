
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiên chi vanga :))</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #101827;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 500px;
  margin: 30px auto;
  padding: 25px;
  background: #1e293b;
  border-radius: 15px;
  text-align: center;
}

h2 {
  color: #60a5fa;
}

.status {
  margin: 15px 0;
  padding: 12px;
  background: #0f172a;
  border-radius: 8px;
  font-size: 14px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: none;
  border-radius: 8px;
  background: #2563eb;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.result {
  margin-top: 20px;
  padding: 20px;
  background: #0f172a;
  border-radius: 10px;
}

.number {
  font-size: 32px;
  font-weight: bold;
  color: #4ade80;
  letter-spacing: 3px;
}

.symbols {
  font-size: 32px;
  margin-top: 15px;
  letter-spacing: 5px;
}

.success {
  color: #4ade80;
}

.error {
  color: #f87171;
}

.history {
  margin-top: 25px;
  text-align: left;
}

.history-item {
  background: #0f172a;
  border-radius: 8px;
  padding: 12px;
  margin-top: 10px;
  font-size: 14px;
  overflow-wrap: anywhere;
}

.values {
  color: #4ade80;
  font-weight: bold;
  margin: 8px 0;
}

.small {
  color: #94a3b8;
  font-size: 12px;
}

.history-symbols {
  font-size: 23px;
  margin: 8px 0;
}

.clear {
  background: #dc2626;
}
</style>
</head>

<body>

<div class="container">

<h2>HEX AUTO CONVERTER</h2>

<div class="status" id="autoStatus">
  Chưa bật đọc Clipboard
</div>

<button id="startButton">
  BẬT TỰ ĐỘNG ĐỌC MÃ
</button>

<button id="checkButton">
  KIỂM TRA CLIPBOARD
</button>

<div class="result" id="result">
  <div class="number">- - - -</div>
  <div class="symbols">⚪ 🔴 ⚪ 🔴</div>
  <div class="small">Chờ mã HEX 32 ký tự</div>
</div>

<div class="history">
  <h3>LỊCH SỬ KẾT QUẢ</h3>
  <div id="history"></div>

  <button class="clear" id="clearButton">
    XÓA LỊCH SỬ
  </button>
</div>

</div>

<script>

// ==========================
// KHAI BÁO
// ==========================

const result = document.getElementById("result");
const autoStatus = document.getElementById("autoStatus");
const historyBox = document.getElementById("history");

const startButton = document.getElementById("startButton");
const checkButton = document.getElementById("checkButton");
const clearButton = document.getElementById("clearButton");

const HISTORY_KEY = "hex_clipboard_history";

let lastHex = "";
let autoEnabled = false;
let timer = null;

// ==========================
// PHÂN TÍCH HEX
// ==========================

function convert(hex) {

  hex = hex.trim();

  if (!/^[0-9a-fA-F]{32}$/.test(hex)) {
    autoStatus.textContent =
      "Mã HEX không hợp lệ";
    return false;
  }

  if (hex === lastHex) {
    return false;
  }

  lastHex = hex;

  const parts = hex.match(/.{8}/g);

  // KẾT QUẢ TỪ 1 ĐẾN 4
  const values = parts.map(part =>
    (parseInt(part, 16) % 4) + 1
  );

  // QUY ĐỔI BIỂU TƯỢNG
  const symbols = values.map(value => {
    if (value === 1 || value === 3) {
      return "🔴 ";
    }

    return "⚪ ";
  });

  const unique = new Set(values);

  const status = unique.size === 4
    ? '<div class="success">✓ 4 kết quả khác nhau</div>'
    : '<div class="error">⚠ Có kết quả trùng nhau</div>';

  result.innerHTML = `
    <div class="number">
      ${values.join(" - ")}
    </div>

    <div class="symbols">
      ${symbols.join(" ")}
    </div>

    <div style="margin-top:15px">
      ${status}
    </div>

    <div class="small" style="margin-top:10px">
      ${hex}
    </div>
  `;

  saveHistory(hex, values, symbols);

  autoStatus.textContent =
    "✓ Đã nhận mã HEX mới";

  return true;
}

// ==========================
// LƯU LỊCH SỬ
// ==========================

function saveHistory(hex, values, symbols) {

  let history = JSON.parse(
    localStorage.getItem(HISTORY_KEY) || "[]"
  );

  history.unshift({
    hex: hex,
    values: values.join(" - "),
    symbols: symbols.join(" "),
    time: new Date().toLocaleString("vi-VN")
  });

  history = history.slice(0, 20);

  localStorage.setItem(
    HISTORY_KEY,
    JSON.stringify(history)
  );

  showHistory();
}

// ==========================
// HIỂN THỊ LỊCH SỬ
// ==========================

function showHistory() {

  const history = JSON.parse(
    localStorage.getItem(HISTORY_KEY) || "[]"
  );

  historyBox.innerHTML = "";

  history.forEach(item => {

    const div = document.createElement("div");
    div.className = "history-item";

    const time = document.createElement("div");
    time.className = "small";
    time.textContent = item.time;

    const values = document.createElement("div");
    values.className = "values";
    values.textContent = item.values;

    const symbols = document.createElement("div");
    symbols.className = "history-symbols";
    symbols.textContent = item.symbols;

    const hex = document.createElement("div");
    hex.className = "small";
    hex.textContent = item.hex;

    div.append(time, values, symbols, hex);

    historyBox.appendChild(div);
  });
}

// ==========================
// ĐỌC CLIPBOARD
// ==========================

async function readClipboard() {

  if (!navigator.clipboard ||
      !navigator.clipboard.readText) {

    autoStatus.textContent =
      "Trình duyệt cần HTTPS để đọc Clipboard";

    return;
  }

  try {

    const text = await navigator.clipboard.readText();

    // Tìm mã HEX 32 ký tự
    const matches = text.match(
      /[0-9a-fA-F]{32}/g
    );

    if (matches && matches.length > 0) {

      convert(matches[matches.length - 1]);

    } else {

      autoStatus.textContent =
        "Đang chờ mã HEX 32 ký tự trong Clipboard";

    }

  } catch (error) {

    autoStatus.textContent =
      "Không có quyền đọc Clipboard. Hãy cấp quyền.";

  }
}

// ==========================
// BẬT TỰ ĐỘNG
// ==========================

async function startAutoRead() {

  if (autoEnabled) return;

  // Đọc trong thao tác bấm nút
  await readClipboard();

  autoEnabled = true;

  startButton.textContent =
    "ĐÃ BẬT TỰ ĐỘNG ĐỌC";

  startButton.disabled = true;

  autoStatus.textContent =
    "Đã bật. Copy mã rồi quay lại trang.";

  timer = setInterval(() => {

    if (!document.hidden) {
      readClipboard();
    }

  }, 1500);
}

// ==========================
// KHI QUAY LẠI TAB
// ==========================

document.addEventListener(
  "visibilitychange",
  () => {

    if (!document.hidden && autoEnabled) {
      readClipboard();
    }

  }
);

// ==========================
// XÓA LỊCH SỬ
// ==========================

function clearHistory() {

  if (!confirm("Bạn muốn xóa toàn bộ lịch sử?")) {
    return;
  }

  localStorage.removeItem(HISTORY_KEY);

  historyBox.innerHTML = "";
}

// ==========================
// SỰ KIỆN NÚT
// ==========================

startButton.addEventListener(
  "click",
  startAutoRead
);

checkButton.addEventListener(
  "click",
  readClipboard
);

clearButton.addEventListener(
  "click",
  clearHistory
);

// ==========================
// KHỞI ĐỘNG
// ==========================

showHistory();

</script>

</body>
</html>
